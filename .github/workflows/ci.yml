name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (no model downloads)
        run: pytest -q

  retrieval-eval:
    # Builds the real index and reports retrieval metrics for every mode. No LLM needed.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/grounded_rag/config.py') }}
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Build index and evaluate retrieval
        run: |
          python -m grounded_rag ingest
          python -m grounded_rag eval --retrieval-only | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Relevance-gate refusals on unanswerable questions (no LLM)
        env:
          RAG_LLM_PROVIDER: none
        run: python -m grounded_rag eval --refusals | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t grounded-rag .
